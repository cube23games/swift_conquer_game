name: SwiftConquer SC-271A Mobile Command Drawer Shadow

on:
  push:
    branches:
      - 'validation/sc271a-mobile-command-drawer-v1*'

permissions:
  contents: read

jobs:
  sc271a-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout SC-271A validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base parent
        run: |
          test "$(git rev-parse HEAD^)" =             "99cc2376dda51f62a325087301a9cc001fcc98a7"

      - name: Verify SC-271A source contract
        run: python3 tools/verify_sc271a.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.0
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run short-landscape drawer tests
        run: |
          flutter test test/features/command_drawer
          flutter test test/features/hud

      - name: Analyze SC-271A files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings             lib/features/command_drawer             lib/features/hud             lib/screens/game_screen.dart             test/features/command_drawer             test/features/hud

      - name: Run complete test suite
        run: flutter test

      - name: Prepare compatible Android shell
        run: |
          rm -rf android
          flutter create . --platforms=android             --project-name swift_conquer_game             --org com.swiftconquer

      - name: Build SC-271A device APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk             build/app/outputs/flutter-apk/swiftconquer-sc271a-drawer-debug.apk

      - name: Seal evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sc271a_evidence
          git log -1 --format='%H  %s' > sc271a_evidence/COMMIT.txt
          sha256sum             build/app/outputs/flutter-apk/swiftconquer-sc271a-drawer-debug.apk             > sc271a_evidence/APK_SHA256SUMS.txt
          cat > sc271a_evidence/DEVICE_GATE.md <<'EOF'
          # SC-271A device gate
          - Drawer opens and closes from right-edge handle
          - Drawer overlays battlefield instead of shrinking it
          - Structures grid exposes War Factory
          - No RenderFlex overflow on short landscape phone
          - Infantry and vehicle tabs explain unlock requirements
          - Bottom command bar remains one horizontal row
          - Two-finger pan and pinch zoom work together
          - Production branch remains untouched
          EOF
          sha256sum sc271a_evidence/* > sc271a_evidence/SHA256SUMS.txt

      - name: Upload SC-271A evidence
        uses: actions/upload-artifact@v4
        with:
          name: SWIFTCONQUER_SC271A_COMMAND_DRAWER_EVIDENCE
          path: sc271a_evidence
          retention-days: 30

      - name: Upload SC-271A APK
        uses: actions/upload-artifact@v4
        with:
          name: SWIFTCONQUER_SC271A_COMMAND_DRAWER_DEBUG_APK
          path: build/app/outputs/flutter-apk/swiftconquer-sc271a-drawer-debug.apk
          retention-days: 14
