name: SwiftConquer SC-271B Primary Production Routing Shadow

on:
  push:
    branches:
      - 'validation/sc271b-primary-production-routing-v1*'

permissions:
  contents: read

jobs:
  sc271b-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout SC-271B validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact SC-271A v2 parent
        run: |
          test "$(git rev-parse HEAD^)" = \
            "1376d1ed2397034e07549c24a1707d542a1fccf7"

      - name: Verify production remains locked
        run: |
          git fetch origin working/phase170-movement-ci
          test "$(git rev-parse origin/working/phase170-movement-ci)" = \
            "dbedc8dd830b380b11e36d9f8e6bf3c8065973c4"

      - name: Verify SC-271B source contract
        run: python3 tools/verify_sc271b.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.0
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run primary production tests
        run: |
          flutter test test/game/production/primary_production_registry_test.dart
          flutter test test/features/command_drawer
          flutter test test/features/hud

      - name: Analyze SC-271B files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/game/production \
            lib/features/command_drawer \
            lib/features/hud \
            lib/game/ui/world_painter.dart \
            lib/screens/game_screen.dart \
            test/game/production \
            test/features/command_drawer \
            test/features/hud

      - name: Run complete test suite
        run: flutter test

      - name: Prepare compatible Android shell
        run: |
          rm -rf android
          flutter create . --platforms=android \
            --project-name swift_conquer_game \
            --org com.swiftconquer

      - name: Build SC-271B device APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/swiftconquer-sc271b-primary-production-debug.apk

      - name: Seal evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sc271b_evidence
          git log -1 --format='%H  %s' > sc271b_evidence/COMMIT.txt
          cat > sc271b_evidence/CONTRACT.md <<'EOF'
          # SC-271B evidence contract
          - First Barracks and War Factory become primary
          - Later matching facilities do not steal primary status
          - Selected secondary facility can be made primary
          - Infantry routes to Primary Barracks
          - Tanks route to Primary War Factory
          - Destroyed primary falls back to oldest survivor
          - Primary facilities show a P battlefield badge
          - Production branch remains untouched
          EOF
          sha256sum \
            build/app/outputs/flutter-apk/swiftconquer-sc271b-primary-production-debug.apk \
            > sc271b_evidence/APK_SHA256SUMS.txt
          sha256sum sc271b_evidence/* \
            > sc271b_evidence/SHA256SUMS.txt

      - name: Upload SC-271B evidence
        uses: actions/upload-artifact@v4
        with:
          name: SWIFTCONQUER_SC271B_PRIMARY_PRODUCTION_EVIDENCE
          path: sc271b_evidence
          retention-days: 30

      - name: Upload SC-271B APK
        uses: actions/upload-artifact@v4
        with:
          name: SWIFTCONQUER_SC271B_PRIMARY_PRODUCTION_DEBUG_APK
          path: build/app/outputs/flutter-apk/swiftconquer-sc271b-primary-production-debug.apk
          retention-days: 14
